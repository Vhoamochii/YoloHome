[platformio]
default_envs = yolo_uno

[env:yolo_uno]
platform = espressif32@7.1.2
board = yolo_uno
framework = arduino
monitor_speed = 115200
lib_deps =
    robtillaart/DHT20@0.3.1
    marcoschwartz/LiquidCrystal_I2C@1.1.4
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; Explicit opt-in only. Frames are marked simulated; the gateway refuses cloud publication.
[env:yolo_uno_sim]
extends = env:yolo_uno
build_flags = ${env:yolo_uno.build_flags} -D TINYML_SIMULATED=1
