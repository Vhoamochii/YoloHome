; Run in this directory, after putting tinyml-fire/ at the YoloHome repository root.
; Reads the group's sources. It never rewrites them.
[platformio]
default_envs = yolo_uno_tinyml
src_dir = ../..
boards_dir = ../firmware/boards
include_dir = ../../firmware/include

[env:yolo_uno_tinyml]
platform = espressif32@7.1.2
board = yolo_uno
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit IO Arduino@4.3.7
    adafruit/Adafruit MQTT Library@2.6.6
    arduino-libraries/ArduinoHttpClient@0.6.1
    adafruit/Adafruit NeoPixel@1.15.1
    robtillaart/DHT20@0.3.1
    marcoschwartz/LiquidCrystal_I2C@1.1.4
lib_ignore = WiFiNINA_-_Adafruit_Fork
lib_ldf_mode = chain+
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D SENSOR_HAS_LIGHT=1
    -I ../firmware/include
build_src_filter =
    -<*>
    +<firmware/src/>
    -<firmware/src/main.cpp>
    -<firmware/src/demo/>
    +<tinyml-fire/integration/src/>
