name: test project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  test-backend:
    runs-on: ubuntu-latest
    continue-on-error: true # Prototype stage: non-blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check backend
        working-directory: ./backend
        run: python -m compileall .
      - name: Install backend dependencies (optional prototype check)
        continue-on-error: true
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend (informational)
        continue-on-error: true
        working-directory: ./backend
        run: |
          pip install pylint
          pylint *.py --disable=C,R,W || true

  test-ai-models:
    runs-on: ubuntu-latest
    continue-on-error: true # Prototype stage: non-blocking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax check AI models
        working-directory: ./ai-models
        run: python -m compileall .
      - name: Install AI dependencies (optional prototype check)
        continue-on-error: true
        working-directory: ./ai-models
        run: |
          python -m pip install --upgrade pip
          pip install -r ../backend/requirements.txt || true

  test-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build firmware
        working-directory: ./firmware
        run: pio run
