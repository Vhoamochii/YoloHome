[env:yolo-uno]
platform = espressif32       ; pin the version you tested: `pio pkg list`, then espressif32@x.y.z
board = yolo_uno
framework = arduino

monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit IO Arduino@4.3.7
    adafruit/Adafruit NeoPixel@1.15.1
    adafruit/DHT sensor library@^1.4.4
    https://github.com/tensorflow/tflite-micro-arduino-examples

build_flags =
    -D ARDUINO_USB_MODE=1          ; USB-C is the ESP32-S3's native USB
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; so Serial prints over USB-C
