; YoloHome firmware — one codebase, two boards. config.h picks the pins from the chip.
;
;   pio run -e yolo_uno -t upload          full firmware, Yolo Uno (ESP32-S3)
;   pio run -e yolobit  -t upload          full firmware, Yolo:Bit (ESP32)
;   pio run -e yolo_uno_demo -t upload     bare-board link test (src/demo/), nothing plugged in
;   pio device monitor -e yolo_uno

[platformio]
default_envs = yolo_uno

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit IO Arduino@4.3.7
    adafruit/Adafruit NeoPixel@1.15.1
    robtillaart/DHT20@^0.3.0                 ; the DHT20 is I2C; Adafruit's DHT library can't read it
    marcoschwartz/LiquidCrystal_I2C@1.1.4
; The Adafruit IO library contains AirLift / MKR1010 headers that #include "WiFiNINA.h"
; unconditionally; PlatformIO's scanner then pulls in Adafruit's WiFiNINA fork, whose WiFi.h
; shadows the ESP32's ("'class WiFiClass' has no member named 'reconnect'").
; (Do NOT ignore "WiFi": that is the ESP32's own library.)
lib_ignore = WiFiNINA_-_Adafruit_Fork
lib_ldf_mode = chain+
; Optional sensors, once plugged in:
;   build_flags = ${yolo_uno.build_flags} -D SENSOR_HAS_LIGHT=1 -D SENSOR_HAS_PIR=1

[yolo_uno]
; 7.1.2 ships Arduino core 2.0.17. Pinned: newer releases switch to core 3.x.
platform = espressif32 @ 7.1.2
; boards/yolo_uno.json from github.com/nhanksd85/YoloUNO_PlatformIO (branch LED_Blinky),
; tested on real hardware. It reuses the M5Stack AtomS3 pin names: SDA, SCL, LED_BUILTIN,
; D7, A0 ... are WRONG for the Yolo Uno — use only the numeric pins in config.h.
board = yolo_uno
build_flags =
    -D ARDUINO_USB_MODE=1                    ; USB-C is the ESP32-S3's native USB
    -D ARDUINO_USB_CDC_ON_BOOT=1             ; so Serial prints over USB-C
    -D SENSOR_HAS_LIGHT=1                    ; light sensor on the A0-A1 port

[yolobit]
platform = espressif32 @ 7.1.2
board = esp32dev
build_flags =

[env:yolo_uno]
extends = yolo_uno
build_src_filter = +<*> -<demo/>

[env:yolobit]
extends = yolobit
build_src_filter = +<*> -<demo/>

[env:yolo_uno_demo]
extends = yolo_uno
build_src_filter = +<*> -<main.cpp>

[env:yolobit_demo]
extends = yolobit
build_src_filter = +<*> -<main.cpp>