; Two boards, one codebase: config.h picks the pins from the chip.
;   pio run -e yolo_uno -t upload      /   pio run -e yolobit -t upload
[env]
framework = arduino
monitor_speed = 115200
; The Adafruit IO library contains AirLift / MKR1010 headers that #include "WiFiNINA.h"
; unconditionally. PlatformIO's dependency scanner reads them even on an ESP32 and pulls in
; Adafruit's WiFiNINA fork, whose own WiFi.h then shadows the ESP32's
; ("'class WiFiClass' has no member named 'reconnect'"). Ignore it by its exact name.
; (Do NOT ignore "WiFi": that is the ESP32's own library.)
lib_ignore = WiFiNINA_-_Adafruit_Fork
lib_ldf_mode = chain+        ; also skip includes behind #if for other boards
lib_deps =
    adafruit/Adafruit IO Arduino@4.3.7
    adafruit/Adafruit NeoPixel@1.15.1

[env:yolo_uno]
; Board file tested on real hardware: copy boards/yolo_uno.json from
; github.com/nhanksd85/YoloUNO_PlatformIO (branch LED_Blinky) into this project's boards/.
; It reuses the M5Stack AtomS3 pin definitions, so the Arduino names SDA, SCL, LED_BUILTIN,
; D7, A0 ... are WRONG for the Yolo Uno. Use the numeric pins in config.h only.
; 7.1.2 ships Arduino core 2.0.17. Pinned because newer releases switch to core 3.x,
; which changes several APIs. Change it deliberately, not by accident.
platform = espressif32 @ 7.1.2
board = yolo_uno
build_flags =
    -D ARDUINO_USB_MODE=1          ; USB-C is the ESP32-S3's native USB
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; so Serial prints over USB-C

[env:yolobit]
platform = espressif32 @ 7.1.2
board = esp32dev